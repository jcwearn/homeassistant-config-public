name: Publish Public Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    uses: jcwearn/workflows/.github/workflows/public-sync.yaml@d774bed1c00c7af3c2b87bec5e6502cf653f8cbf  # v1.8.9
    with:
      target-repo: jcwearn/homeassistant-config-public
      readme-override: .github/public-README.md
      # The author stays github-actions[bot]; the committer is the identity
      # GitHub verifies a signature against, so it must be an email on the
      # account owning PUBLIC_SYNC_SIGNING_KEY.
      signer-name: Jackson Wearn
      signer-email: jcwearn@users.noreply.github.com
    secrets:
      DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
      SIGNING_KEY: ${{ secrets.PUBLIC_SYNC_SIGNING_KEY }}
