master_bedroom_night_fan:
  alias: Master Bedroom Night Fan
  icon: mdi:fan
  sequence:
    - condition: state
      entity_id: fan.master_bedroom_ceiling_fan
      state: "off"
    # Outdoor temp, not indoor: the bedroom sensor is one of the ecobee's active
    # sensors, so the AC holds it at the sleep setpoint year-round.
    - variables:
        outdoor: "{{ state_attr('weather.home', 'temperature') | float(75) }}"
    - action: fan.set_percentage
      target:
        entity_id: fan.master_bedroom_ceiling_fan
      data:
        percentage: "{{ 100 if outdoor >= 65 else 75 }}"
