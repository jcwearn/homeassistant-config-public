- id: turn_on_office_light_motion
  alias: Turn On Office Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.office_sensor_motion_occupancy
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 300 }}
    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.ha_alarm
          state: armed_away
    - condition: numeric_state
      entity_id: sensor.office_sensor_motion_illuminance
      below: 120
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
  action:
    - action: light.turn_on
      target:
        entity_id: light.office_ceiling_fan_light

- id: turn_off_office_light_motion
  alias: Turn Off Office Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.office_sensor_motion_occupancy
      to: "off"
      for:
        minutes: 240
      id: motion
    - trigger: state
      entity_id: binary_sensor.ecobee_sensor_office_occupancy
      to: "off"
      for:
        minutes: 240
      id: ecobee
    - trigger: state
      entity_id: light.office_ceiling_fan_light
      to: "on"
      for:
        minutes: 240
      id: fallback
    - trigger: time_pattern
      minutes: /15
      id: watchdog
  condition:
    - condition: state
      entity_id: light.office_ceiling_fan_light
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.office_ceiling_fan_light.last_changed).total_seconds() >= 14400 }}
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    - condition: state
      entity_id: binary_sensor.office_presence
      state: "off"
      for:
        minutes: 10
  action:
    - if:
        - condition: trigger
          id: watchdog
      then:
        - action: logbook.log
          data:
            name: Lights Watchdog
            message: >-
              Turned off light.office_ceiling_fan_light (on for
              {{ ((now() - states.light.office_ceiling_fan_light.last_changed).total_seconds() / 60)
                 | round(0) }} minutes)
            entity_id: light.office_ceiling_fan_light
    - action: fan.turn_off
      target:
        entity_id: fan.office_fan
    - action: light.turn_off
      target:
        entity_id: light.office_ceiling_fan_light
