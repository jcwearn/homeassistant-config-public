- id: turn_on_main_floor_bathroom_light_motion
  alias: Turn On Main Floor Bathroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_bathroom_sensor_motion_occupancy
      to: "on"
    - trigger: state
      entity_id: binary_sensor.main_floor_bathroom_sensor_magnet_contact
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.main_floor_bathroom_sensor_magnet_contact
      state: "on"
  action:
    - action: light.turn_on
      target:
        entity_id: light.main_floor_bathroom_lights
    - action: fan.turn_on
      target:
        entity_id: fan.main_floor_bathroom_fan

- id: turn_off_main_floor_bathroom_light_motion
  alias: Turn Off Main Floor Bathroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_bathroom_sensor_motion_occupancy
      to: "off"
      for:
        minutes: 15
      id: motion
    - trigger: state
      entity_id: light.main_floor_bathroom_lights
      to: "on"
      for:
        minutes: 15
      id: fallback
    - trigger: time_pattern
      minutes: /15
      id: watchdog
  condition:
    - condition: state
      entity_id: light.main_floor_bathroom_lights
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.main_floor_bathroom_lights.last_changed).total_seconds() >= 900 }}
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
  action:
    - if:
        - condition: trigger
          id: watchdog
      then:
        - action: logbook.log
          data:
            name: Lights Watchdog
            message: >-
              Turned off light.main_floor_bathroom_lights (on for
              {{ ((now() - states.light.main_floor_bathroom_lights.last_changed).total_seconds() / 60)
                 | round(0) }} minutes)
            entity_id: light.main_floor_bathroom_lights
    - action: fan.turn_off
      target:
        entity_id: fan.main_floor_bathroom_fan
    - action: light.turn_off
      target:
        entity_id: light.main_floor_bathroom_lights

- id: turn_off_main_floor_bathroom_door_close
  alias: Turn Off Main Floor Bathroom Light - Door Close
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_bathroom_sensor_magnet_contact
      to: "off"
  condition:
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    - condition: state
      entity_id: light.main_floor_bathroom_lights
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.main_floor_bathroom_lights.last_changed).total_seconds() >= 20 }}
  action:
    - action: light.turn_off
      target:
        entity_id: light.main_floor_bathroom_lights
    - action: fan.turn_off
      target:
        entity_id: fan.main_floor_bathroom_fan
