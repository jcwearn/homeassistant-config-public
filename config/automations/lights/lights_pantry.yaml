- id: lights_pantry_contact
  alias: Pantry Light - Contact
  trigger:
    - trigger: state
      entity_id: binary_sensor.pantry_contact
      to: "on"
      id: door_open
    - trigger: state
      entity_id: binary_sensor.pantry_contact
      to: "off"
      id: door_closed
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.kitchen_pantry_open_pantry
        - conditions:
            - condition: trigger
              id: door_closed
          sequence:
            - if:
                - condition: state
                  entity_id: light.kitchen_light_5
                  state: "on"
              then:
                - action: light.turn_on
                  target:
                    entity_id: light.kitchen_light_4
                  data:
                    brightness: "{{ state_attr('light.kitchen_light_5', 'brightness') }}"
                    color_temp_kelvin: "{{ state_attr('light.kitchen_light_5', 'color_temp_kelvin') }}"
              else:
                - action: light.turn_off
                  target:
                    entity_id: light.kitchen_light_4
