- id: turn_on_main_floor_lights_motion
  alias: Turn On Main Floor Lights - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_stairwell_motion
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.basement_stairwell_motion', 'off') or
           (now() - states.binary_sensor.basement_stairwell_motion.last_changed).total_seconds() > 1 }}
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    # Dawn brightens the main floor well before sunrise. Once the sun is within
    # 4 degrees of the horizon there is usually enough daylight to skip the
    # scene. Morning only - evening behaviour is deliberately unchanged.
    - condition: template
      value_template: >-
        {{ not state_attr('sun.sun', 'rising')
           or state_attr('sun.sun', 'elevation') | float(0) < -4 }}
    - condition: state
      entity_id: group.main_floor_lights
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.living_room
          state: playing
  action:
    - action: scene.turn_on
      target:
        entity_id: scene.downstairs_relax

- id: turn_on_upstairs_hallway_stairwell_motion
  alias: Turn On Upstairs Hallway Light - Stairwell Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_stairwell_motion
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.basement_stairwell_motion', 'off') or
           (now() - states.binary_sensor.basement_stairwell_motion.last_changed).total_seconds() > 1 }}
    - condition: numeric_state
      entity_id: sensor.main_floor_stairwell_sensor_motion_02_illuminance
      below: 40
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.bed_presence_c18e1c_bed_occupied_either
              state: "on"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.upstairs_hallway_nightlight
      default:
        - action: scene.turn_on
          target:
            entity_id: scene.upstairs_hallway_relax

- id: turn_off_main_floor_lights_daylight
  alias: Turn Off Main Floor Lights - Morning Daylight
  trigger:
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: 5
      id: daylight
    - trigger: time_pattern
      minutes: /5
      id: watchdog
  condition:
    # Clear the overnight lights once per morning, then leave the day alone.
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           this.attributes.last_triggered.date() < now().date() }}
    - condition: state
      entity_id: light.main_floor_lights
      state: "on"
    - condition: template
      value_template: >-
        {{ state_attr('sun.sun', 'rising')
           and state_attr('sun.sun', 'elevation') | float(0) > 5 }}
    - condition: time
      before: "12:00:00"
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    - condition: template
      value_template: >-
        {{ (now() - states.light.main_floor_lights.last_changed).total_seconds() >= 300 }}
  action:
    - variables:
        # Kitchen at the Cooking/Cleaning scene (Kitchen Button) means it was
        # turned on on purpose - turn off the rest of the main floor only.
        kitchen_explicit: >-
          {{ is_state('light.kitchen', 'on') and
             state_attr('light.kitchen', 'brightness') == 255 and
             state_attr('light.kitchen', 'color_temp_kelvin') == 4291 }}
        targets: >-
          {{ ['light.living_room', 'light.stairwell', 'light.dining_room_light',
              'light.main_floor_bathroom_lights']
             if kitchen_explicit else ['light.main_floor_lights'] }}
    - action: logbook.log
      data:
        name: Lights Watchdog
        message: >-
          Turned off light.main_floor_lights - main floor is bright (on for
          {{ ((now() - states.light.main_floor_lights.last_changed).total_seconds() / 60)
             | round(0) }} minutes){{ ' (kept kitchen on)' if kitchen_explicit else '' }}
        entity_id: light.main_floor_lights
    - action: light.turn_off
      target:
        entity_id: "{{ targets }}"
      data:
        transition: 20
