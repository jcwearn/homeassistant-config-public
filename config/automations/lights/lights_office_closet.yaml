- id: lights_office_closet_contact
  alias: Office Closet Light - Contact
  trigger:
    - trigger: state
      entity_id: binary_sensor.office_closet_sensor_contact_contact
      to: "on"
      id: door_open
    - trigger: state
      entity_id: binary_sensor.office_closet_sensor_contact_contact
      to: "off"
      id: door_closed
    - trigger: time_pattern
      minutes: /5
      id: watchdog
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.office_closet_lights
        - conditions:
            - condition: trigger
              id: door_closed
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.office_closet_lights
        - conditions:
            - condition: trigger
              id: watchdog
            - condition: state
              entity_id: light.office_closet_lights
              state: "on"
            - condition: template
              value_template: >-
                {{ (now() - states.light.office_closet_lights.last_changed).total_seconds() >= 300 }}
          sequence:
            - action: logbook.log
              data:
                name: Lights Watchdog
                message: >-
                  Turned off light.office_closet_lights (on for
                  {{ ((now() - states.light.office_closet_lights.last_changed).total_seconds() / 60)
                     | round(0) }} minutes)
                entity_id: light.office_closet_lights
            - action: light.turn_off
              target:
                entity_id: light.office_closet_lights
