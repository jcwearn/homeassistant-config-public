- id: turn_on_master_closet_light_motion
  alias: Turn On Master Closet Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.master_bedroom_closet_sensor_motion_occupancy
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.bed_presence_c18e1c_bed_occupied_either
      state: "off"
  action:
    - action: light.turn_on
      target:
        entity_id: light.master_closet_lights

- id: turn_off_master_closet_light_motion
  alias: Turn Off Master Closet Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.master_bedroom_closet_sensor_motion_occupancy
      to: "off"
      id: motion
    - trigger: state
      entity_id: light.master_closet_lights
      to: "on"
      for:
        minutes: 5
      id: fallback
    - trigger: time_pattern
      minutes: /5
      id: watchdog
  condition:
    - condition: state
      entity_id: light.master_closet_lights
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.master_closet_lights.last_changed).total_seconds() >= 300 }}
  action:
    - if:
        - condition: trigger
          id: watchdog
      then:
        - action: logbook.log
          data:
            name: Lights Watchdog
            message: >-
              Turned off light.master_closet_lights (on for
              {{ ((now() - states.light.master_closet_lights.last_changed).total_seconds() / 60)
                 | round(0) }} minutes)
            entity_id: light.master_closet_lights
    - action: light.turn_off
      target:
        entity_id: light.master_closet_lights
