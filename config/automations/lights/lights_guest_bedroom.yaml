- id: turn_on_guest_bedroom_light_motion
  alias: Turn On Guest Bedroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_sensor_motion_occupancy
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 300 }}
    # Guest mode turns the room dumb: switches and the remote only.
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
    # Backstop for when guest mode was never enabled (e.g. a dead door sensor):
    # never light the room someone is sleeping in overnight.
    - condition: not
      conditions:
        - condition: time
          after: "22:00:00"
          before: "08:00:00"
    - condition: state
      entity_id: binary_sensor.guest_bedroom_sensor_magnet_contact
      state: "on"
    - condition: numeric_state
      entity_id: sensor.guest_bedroom_sensor_motion_illuminance
      below: 60
  action:
    - action: scene.turn_on
      target:
        entity_id: scene.guest_room_bright

- id: turn_off_guest_bedroom_light_motion
  alias: Turn Off Guest Bedroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_sensor_motion_occupancy
      to: "off"
      for:
        minutes: 15
      id: motion
    - trigger: state
      entity_id: light.guest_room
      to: "on"
      for:
        minutes: 15
      id: fallback
    - trigger: time_pattern
      minutes: /15
      id: watchdog
  condition:
    - condition: state
      entity_id: light.guest_room
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.guest_room.last_changed).total_seconds() >= 900 }}
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    # Don't turn off a light the guest deliberately turned on.
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
  action:
    - if:
        - condition: trigger
          id: watchdog
      then:
        - action: logbook.log
          data:
            name: Lights Watchdog
            message: >-
              Turned off light.guest_room (on for
              {{ ((now() - states.light.guest_room.last_changed).total_seconds() / 60)
                 | round(0) }} minutes)
            entity_id: light.guest_room
    - action: light.turn_off
      target:
        entity_id: light.guest_room
