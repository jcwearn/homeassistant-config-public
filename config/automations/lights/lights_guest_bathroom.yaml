- id: turn_on_guest_bathroom_light_motion
  alias: Turn On Guest Bathroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_bathroom_sensor_motion_occupancy
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 300 }}
    # Guest mode turns the room dumb: switches and the remote only.
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
  action:
    # Overnight a guest still needs to see, so dim rather than suppress - but
    # skip the fan, which is loud enough to wake the bedroom next door.
    - if:
        - condition: time
          after: "22:00:00"
          before: "08:00:00"
      then:
        - action: light.turn_on
          target:
            entity_id: light.guest_bedroom_bathroom_lights
          data:
            brightness_pct: 10
      else:
        - action: light.turn_on
          target:
            entity_id: light.guest_bedroom_bathroom_lights
        - action: fan.turn_on
          target:
            entity_id: fan.guest_bedroom_bathroom_fan

- id: turn_off_guest_bathroom_light_motion
  alias: Turn Off Guest Bathroom Light - Motion
  trigger:
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_bathroom_sensor_motion_occupancy
      to: "off"
      for:
        minutes: 15
      id: motion
    - trigger: state
      entity_id: light.guest_bedroom_bathroom_lights
      to: "on"
      for:
        minutes: 15
      id: fallback
    - trigger: time_pattern
      minutes: /15
      id: watchdog
  condition:
    - condition: state
      entity_id: light.guest_bedroom_bathroom_lights
      state: "on"
    - condition: template
      value_template: >-
        {{ (now() - states.light.guest_bedroom_bathroom_lights.last_changed).total_seconds() >= 900 }}
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
  action:
    - if:
        - condition: trigger
          id: watchdog
      then:
        - action: logbook.log
          data:
            name: Lights Watchdog
            message: >-
              Turned off light.guest_bedroom_bathroom_lights (on for
              {{ ((now() - states.light.guest_bedroom_bathroom_lights.last_changed).total_seconds() / 60)
                 | round(0) }} minutes)
            entity_id: light.guest_bedroom_bathroom_lights
    - action: light.turn_off
      target:
        entity_id: light.guest_bedroom_bathroom_lights
    - action: fan.turn_off
      target:
        entity_id: fan.guest_bedroom_bathroom_fan
