- id: schedule_open_curtains
  alias: Open Curtains After Alarm
  mode: single
  trigger:
    # Removed from the iOS companion app in 2026.8.0 (home-assistant/iOS#5279)
    # when the legacy SiriKit actions gave way to App Intents. Kept in case the
    # action comes back; the input_button below is the live path.
    - trigger: event
      event_type: shortcut_event
      event_data:
        event: wake_up_alarm
    # not_to, not not_from: input_button does not restore state, so it comes
    # back as `unknown` on every HA start and the first press of the day is
    # always `unknown` -> timestamp. Filtering on `from` swallowed exactly the
    # press we want; filtering on `to` drops the restart blip instead.
    - trigger: state
      entity_id: input_button.wake_up_alarm
      not_to:
        - unknown
        - unavailable
  condition:
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           this.attributes.last_triggered | as_datetime | as_local < now().replace(hour=0, minute=0, second=0, microsecond=0) }}
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  action:
    - delay:
        minutes: 15
    # Same 5 degree floor as blinds_open_curtains_bed_empty - sunrise alone is
    # too dim for the room to be worth uncovering. A wait rather than a
    # condition because in midwinter the sun does not clear 5 degrees until
    # well over an hour after the alarm, and a condition there would just skip
    # the morning entirely. wait_template re-checks before subscribing, so a
    # sun already up passes straight through.
    - wait_template: >-
        {{ state_attr('sun.sun', 'elevation') | float(0) > 5 }}
      # Give up at 11:00 - if it is not light by then something is wrong.
      # Clamped at 0 because a negative timeout aborts the run with an error.
      timeout: >-
        {{ [(today_at('11:00') - now()).total_seconds(), 0] | max }}
      continue_on_timeout: false
    # Both re-checked below the wait, not above it, so they reflect the moment
    # the curtains actually move - which may be an hour after the alarm.
    - condition: state
      entity_id: input_boolean.privacy_mode
      state: "off"
    - condition: numeric_state
      entity_id: cover.master_bedroom_curtains
      attribute: current_position
      below: 21
    - action: cover.open_cover
      target:
        entity_id: cover.master_bedroom_curtains
