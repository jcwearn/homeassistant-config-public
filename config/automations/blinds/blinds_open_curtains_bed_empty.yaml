# Catch-all for schedule_open_curtains: covers weekends, and on weekdays backs
# it up when the alarm never reaches HA. Runs 15 minutes later, so on a normal
# weekday the curtains are already open and the position check below no-ops.
- id: blinds_open_curtains_bed_empty
  alias: Open Curtains After Bed Empty
  mode: single
  trigger:
    # No `from:` on purpose - the bed sensor blips to unavailable, and an
    # unavailable -> off recovery should still start the 30 minute clock.
    - trigger: state
      entity_id: binary_sensor.bed_presence_c18e1c_bed_occupied_either
      to: "off"
      for:
        minutes: 30
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           this.attributes.last_triggered | as_datetime | as_local < now().replace(hour=0, minute=0, second=0, microsecond=0) }}
    # 1 degree, matching schedule_open_curtains - a few minutes past sunrise,
    # which HA puts at -0.833 degrees to allow for refraction. Deliberately
    # below the 5 degree floor turn_off_main_floor_lights_daylight still uses:
    # when to stop lighting the main floor is a different judgment than when
    # the bedroom is bright enough to uncover.
    - condition: template
      value_template: >-
        {{ state_attr('sun.sun', 'elevation') | float(0) > 1 }}
    - condition: state
      entity_id: input_boolean.privacy_mode
      state: "off"
    # A condition rather than an action step so a failed check leaves
    # last_triggered untouched and the automation eligible to fire later.
    - condition: numeric_state
      entity_id: cover.master_bedroom_curtains
      attribute: current_position
      below: 21
  action:
    - action: cover.open_cover
      target:
        entity_id: cover.master_bedroom_curtains
