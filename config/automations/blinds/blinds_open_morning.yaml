- id: blinds_open_morning
  alias: Open Blinds in Morning
  trigger:
    - trigger: state
      entity_id: binary_sensor.main_floor_stairwell_sensor_motion_01_occupancy
      to: "on"
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           this.attributes.last_triggered.date() < now().date() }}
    - condition: sun
      after: sunrise
      before: sunset
    - condition: state
      entity_id: input_boolean.privacy_mode
      state: "off"
  action:
    - action: script.turn_on
      target:
        entity_id: script.open_blinds
