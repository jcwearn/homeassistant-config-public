- id: schedule_nightly_close_blinds
  alias: Nightly Close Blinds
  trigger:
    - trigger: state
      entity_id: sun.sun
      to: below_horizon
      for:
        minutes: 10
  action:
    - parallel:
        - action: script.turn_on
          target:
            entity_id: script.close_blinds
        - if:
            - condition: state
              entity_id: binary_sensor.is_somebody_home
              state: "on"
          then:
            - if:
                - condition: state
                  entity_id: light.main_floor_ambient_lights
                  state: "off"
              then:
                - action: scene.turn_on
                  target:
                    entity_id: scene.downstairs_relax
                  data:
                    transition: 10
              else:
                - variables:
                    off_lights: >
                      {{ expand('light.main_floor_ambient_lights')
                         | selectattr('state', 'eq', 'off')
                         | map(attribute='entity_id')
                         | list }}
                - if:
                    - condition: template
                      value_template: "{{ off_lights | length > 0 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ off_lights }}"
                      data:
                        brightness: 87
                        color_temp_kelvin: 2257
                        transition: 10
