- id: guest_mode_door
  alias: Guest Mode - Door
  trigger:
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_sensor_magnet_contact
      to: "on"
      id: door_open
    - trigger: state
      entity_id: binary_sensor.guest_bedroom_sensor_magnet_contact
      to: "off"
      id: door_closed
  condition:
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: door_closed
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.guest_override
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.guest_override
