- id: schedule_vacuum_daily
  alias: Daily Vacuum Run
  # restart: a Siri run fired while parked in the wait below must not be dropped
  mode: restart
  trigger:
    - trigger: time
      at: "13:30:00"
      id: scheduled
    - trigger: event
      event_type: shortcut_event
      event_data:
        name: vacuum
      id: manual
  condition:
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: scheduled
            - condition: state
              entity_id: binary_sensor.vacuum_not_run_recently
              state: "on"
        - condition: and
          conditions:
            - condition: trigger
              id: manual
            - condition: numeric_state
              entity_id: sensor.vacuum_cleaning_time_12h
              below: 1
  action:
    # A scheduled run must never interrupt someone in the living room. Wait for
    # the TV to go quiet or the house to empty, then run. Siri-triggered runs are
    # deliberate, so they skip the wait.
    - if:
        - condition: trigger
          id: scheduled
        - condition: state
          entity_id: binary_sensor.living_room_tv_in_use
          state: "on"
        - condition: state
          entity_id: binary_sensor.is_somebody_home
          state: "on"
      then:
        # wait_template, not wait_for_trigger: it re-checks the condition before
        # subscribing, so a state change between the if above and the wait
        # below can't strand the run until the timeout.
        - wait_template: >-
            {{ is_state('binary_sensor.living_room_tv_in_use', 'off')
               or is_state('binary_sensor.is_somebody_home', 'off') }}
          # Give up at 20:00 and try again tomorrow. Clamped at 0 because a
          # negative timeout aborts the run with an error instead.
          timeout: >-
            {{ [(today_at('20:00') - now()).total_seconds(), 0] | max }}
          continue_on_timeout: false
    - action: script.turn_on
      target:
        entity_id: script.run_vacuum

- id: schedule_vacuum_reset_delay
  alias: Reset Vacuum Delay
  trigger:
    - trigger: time
      at: "00:00:00"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.vacuum_delay
