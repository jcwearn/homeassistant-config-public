- id: presence_arrive
  alias: Geofence - Arriving Home
  trigger:
    - trigger: state
      entity_id:
        - person.jackson
        - person.anupama
      to: home
  condition:
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 300 }}
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.vacation_mode
    # Fire-and-forget so a lock timeout can't abort the rest of the automation
    - action: script.turn_on
      target:
        entity_id: script.set_lock
      data:
        variables:
          lock_entity: lock.garage_door
          operation: unlock
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.jackson' }}"
          sequence:
            - action: notify.mobile_app_jacksons_iphone
              data:
                message: Your garage door has been auto unlocked by HA
                data:
                  actions:
                    - action: UNLOCK_GARAGE
                      title: Unlock Garage
                    - action: UNLOCK_FRONT
                      title: Unlock Front
                    - action: OPEN_GARAGE
                      title: Open Garage
                  tag: lockdown
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.anupama' }}"
          sequence:
            - action: notify.mobile_app_noops
              data:
                message: The garage door has been auto unlocked by HA
                data:
                  actions:
                    - action: UNLOCK_GARAGE
                      title: Unlock Garage
                    - action: UNLOCK_FRONT
                      title: Unlock Front
                    - action: OPEN_GARAGE
                      title: Open Garage
                  tag: lockdown
    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.ha_alarm
          state: disarmed
    - action: script.turn_on
      target:
        entity_id: script.enable_home_mode
      data:
        variables:
          source: "{{ trigger.entity_id }}"
