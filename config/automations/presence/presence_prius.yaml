- id: presence_prius_away
  alias: Geofence - Prius Left
  trigger:
    - trigger: state
      entity_id: binary_sensor.prius_presence_status
      to: "off"
  condition:
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.ha_alarm
          state: armed_away
    - condition: template
      value_template: "{{ states('zone.home') | int == 0 }}"
  action:
    - action: script.turn_on
      target:
        entity_id: script.enable_away_mode
      data:
        variables:
          source: geofence
