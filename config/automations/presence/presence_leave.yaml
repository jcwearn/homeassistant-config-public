- id: presence_leave_nobody_home
  alias: Geofence - Last Person Leaving
  trigger:
    - trigger: state
      entity_id:
        - person.jackson
        - person.anupama
      to: not_home
  condition:
    - condition: numeric_state
      entity_id: zone.home
      below: 1
    - condition: state
      entity_id: input_boolean.guest_override
      state: "off"
    - condition: state
      entity_id: input_boolean.party_mode
      state: "off"
  action:
    - action: script.turn_on
      target:
        entity_id: script.enable_away_mode
      data:
        variables:
          source: geofence

- id: presence_leave_someone_still_home
  alias: Geofence - Person Left, Others Still Home
  trigger:
    - trigger: state
      entity_id:
        - person.jackson
        - person.anupama
      to: not_home
  condition:
    - condition: numeric_state
      entity_id: zone.home
      above: 0
  action:
    - delay:
        seconds: 30
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.jackson' }}"
          sequence:
            - action: notify.mobile_app_jacksons_iphone
              data:
                message: "Goodbye! Anupama is still home, holding down the fort."
            - action: notify.mobile_app_noops
              data:
                message: "Jackson just left home.  You've got the place to yourself!"
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.anupama' }}"
          sequence:
            - action: notify.mobile_app_noops
              data:
                message: "Goodbye! Jackson is still home, holding down the fort."
            - action: notify.mobile_app_jacksons_iphone
              data:
                message: "Anupama just left home.  You've got the place to yourself!"

- id: presence_leave_guest_mode
  alias: Geofence - Last Person Leaving (Guest Mode Active)
  trigger:
    - trigger: state
      entity_id:
        - person.jackson
        - person.anupama
      to: not_home
  condition:
    - condition: numeric_state
      entity_id: zone.home
      below: 1
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.guest_override
          state: "on"
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.jackson' }}"
          sequence:
            - action: notify.mobile_app_jacksons_iphone
              data:
                message: Would you like to lock down the house?
                data:
                  actions:
                    - action: LOCK_DOWN
                      title: Lock Down
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'person.anupama' }}"
          sequence:
            - action: notify.mobile_app_noops
              data:
                message: Would you like to lock down the house?
                data:
                  actions:
                    - action: LOCK_DOWN
                      title: Lock Down
