- id: misc_siri_spooky_time
  alias: Siri Shortcut - Spooky Time
  mode: single
  trigger:
    - trigger: event
      event_type: shortcut_event
      event_data:
        event: spooky_time
  action:
    - action: switch.turn_on
      target:
        entity_id:
          - switch.basement_smart_plug
          - switch.living_room_smart_plug
    - action: scene.turn_on
      target:
        entity_id: scene.downstairs_spooky_time
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.party_mode
