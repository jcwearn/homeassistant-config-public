- id: misc_doorbell_ring
  alias: Doorbell Ring
  trigger:
    - trigger: state
      entity_id: binary_sensor.doorbell_lite_doorbell
      to: "on"
  action:
    # Turn on front door light at night
    - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
      then:
        - action: scene.turn_on
          target:
            entity_id: scene.front_door_bright
    # Delay briefly for camera to capture frame
    - delay:
        milliseconds: 500
    # Take snapshot
    - action: camera.snapshot
      target:
        entity_id: camera.doorbell_lite_high_resolution_channel
      data:
        filename: /config/www/snapshot_front.jpg
    # Notify with snapshot and unlock action
    - action: notify.mobile_app_jacksons_iphone
      data:
        title: Doorbell
        message: Somebody is at your doorbell
        data:
          actions:
            - action: UNLOCK_FRONT
              title: Unlock Door
          image: /local/snapshot_front.jpg
          clickAction: "app://com.ubnt.unifi.protect"
