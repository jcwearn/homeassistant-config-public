- id: misc_system_backup_stale
  alias: System - Backup Staleness Alert
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.backups_stale
      to: "on"
  action:
    - action: notify.mobile_app_jacksons_iphone
      data:
        message: The Home Assistant Snapshots are behind by more than 12 hours.

- id: misc_system_disk_use
  alias: System - High Disk Utilization Alert
  mode: single
  trigger:
    - trigger: numeric_state
      entity_id: sensor.disk_use_percent
      above: 85
  action:
    - action: notify.mobile_app_jacksons_iphone
      data:
        message: "{{ states('sensor.disk_use_percent') }}% of disk used"

- id: misc_system_updates_available
  alias: System - Update Available Notification
  mode: queued
  trigger:
    - trigger: event
      event_type: state_changed
  condition:
    - condition: template
      value_template: >
        {{ trigger.event.data.entity_id.startswith('update.') and
           trigger.event.data.new_state is not none and
           trigger.event.data.new_state.state == 'on' and
           (trigger.event.data.old_state is none or
            trigger.event.data.old_state.state != 'on') }}
  action:
    - action: notify.mobile_app_jacksons_iphone
      data:
        message: "{{ trigger.event.data.new_state.attributes.friendly_name }}: update available"
