- id: button_master_bedroom
  alias: Master Bedroom Button
  trigger:
    - trigger: device
      domain: mqtt
      device_id: 10e80934bb7dbd7e2a7f8de022207f74
      type: action
      subtype: single
      id: single
    - trigger: device
      domain: mqtt
      device_id: f1693ef017ab0affc47143436597e246
      type: action
      subtype: single
      id: single
    - trigger: device
      domain: mqtt
      device_id: 10e80934bb7dbd7e2a7f8de022207f74
      type: action
      subtype: double
      id: double
    - trigger: device
      domain: mqtt
      device_id: f1693ef017ab0affc47143436597e246
      type: action
      subtype: double
      id: double
    - trigger: device
      domain: mqtt
      device_id: 10e80934bb7dbd7e2a7f8de022207f74
      type: action
      subtype: hold
      id: hold
    - trigger: device
      domain: mqtt
      device_id: f1693ef017ab0affc47143436597e246
      type: action
      subtype: hold
      id: hold
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: single
          sequence:
            - if:
                - condition: state
                  entity_id: light.master_bedroom_ceiling_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_bedroom_ceiling_lights
            - if:
                - condition: state
                  entity_id: light.master_closet_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_closet_lights
            - if:
                - condition: state
                  entity_id: light.master_bedroom_nightstands
                  state: "off"
              then:
                - action: scene.turn_on
                  target:
                    entity_id: scene.master_bedroom_nightstands_relax
              else:
                - action: light.turn_off
                  target:
                    entity_id: light.master_bedroom_nightstands
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.master_bedroom_lights_frozen
        - conditions:
            - condition: trigger
              id: double
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.master_bedroom_reading
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.master_bedroom_lights_frozen
            - if:
                - condition: state
                  entity_id: light.master_bedroom_ceiling_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_bedroom_ceiling_lights
            - if:
                - condition: state
                  entity_id: light.master_closet_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_closet_lights
        - conditions:
            - condition: trigger
              id: hold
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.master_bedroom_nighttime
            - if:
                - condition: state
                  entity_id: light.master_bedroom_ceiling_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_bedroom_ceiling_lights
            - if:
                - condition: state
                  entity_id: light.master_closet_lights
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.master_closet_lights
