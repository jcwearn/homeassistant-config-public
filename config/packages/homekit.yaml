homekit:
  - filter:
      include_entities:
        # alarm control panel
        - alarm_control_panel.ha_alarm
        # camera
        - camera.g4_instant_entryway_high
        - camera.g4_instant_main_floor_high_2
        - camera.garage
        - camera.outside_garage
        - camera.doorbell_lite_high_resolution_channel
        # climate
        - climate.basement_2
        - climate.main_floor_2
        - climate.upstairs_2
        # contact sensor
        - binary_sensor.garage_door_sensor_magnet_contact
        - binary_sensor.roof_door_sensor_magnet_contact
        - binary_sensor.front_door_sensor_magnet_contact
        # cover
        - cover.dining_room_shades
        - cover.garage_door
        - cover.living_room_shades
        - cover.master_bathroom_shade
        - cover.master_bedroom_curtains
        - cover.master_bedroom_master_shade
        - cover.office_shade
        - cover.guest_bedroom_shade
        # fan
        - fan.basement_fan
        - fan.guest_bedroom_bathroom_fan
        - fan.living_room_fan
        - fan.main_floor_bathroom_fan
        - fan.master_bedroom_ceiling_fan
        - fan.office_bathroom_fan
        - fan.office_fan
        # input boolean
        - input_boolean.privacy_mode
        - input_boolean.guest_override
        - input_boolean.party_mode
        - input_boolean.vacation_mode
        - input_boolean.theater_mode
        # light (hue)
        - light.basement_hallway
        - light.corner_light
        - light.outside_front_door_light
        - light.guest_room
        - light.kitchen
        - light.kitchen_ceiling_lights
        - light.kitchen_hanging_lights
        - light.living_room
        - light.living_room_ceiling_lights
        - light.master_bedroom
        - light.master_bedroom_ceiling_lights
        - light.master_bedroom_nightstands
        - light.upstairs_hallway
        # light (lutron)
        - light.basement_stairwell_lights
        - light.dining_room_light
        - light.guest_bedroom_bathroom_lights
        - light.office_bathroom_lights
        # light (helper)
        - light.garage_main_lights
        - light.garage_wall_lights
        - light.kitchen_under_cabinet
        - light.laundry_room_light
        - light.main_floor_bathroom_lights
        - light.master_closet_lights
        - light.office_ceiling_fan_light
        - light.office_closet_lights
        - light.utility_room_light
        - light.main_floor_lights
        # lock
        # - lock.garage_door
        # occupancy
        - binary_sensor.guest_bedroom_bathroom_sensor_motion_occupancy
        - binary_sensor.guest_bedroom_sensor_motion_occupancy
        - binary_sensor.laundry_room_sensor_motion_occupancy
        - binary_sensor.main_floor_bathroom_sensor_motion_occupancy
        - binary_sensor.master_motion
        - binary_sensor.office_bathroom_sensor_motion_occupancy
        - binary_sensor.office_sensor_motion_occupancy
        - binary_sensor.roof_stairwell_sensor_motion_01_occupancy
        - binary_sensor.basement_stairwell_motion
        - binary_sensor.main_floor_stairwell_motion
        # scene
        - scene.downstairs_relax
        - scene.downstairs_nightlight
        - scene.downstairs_read
        # switch
        - switch.living_room_smart_plug
        # vacuum
        # - vacuum.roomba_j7
    entity_config:
      alarm_control_panel.ha_alarm:
        code: !secret alarm_pin  # pass-through code for HomeKit arm/disarm
